[program:ritelin-reverb]
process_name=%(program_name)s
command=php /var/www/ritelin/backend/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/ritelin/backend
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/ritelin-reverb.log
stopwaitsecs=10
